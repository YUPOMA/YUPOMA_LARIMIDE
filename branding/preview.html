<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VELOX Logo</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f4f5;color:#111}
.row{display:flex;flex-wrap:wrap;gap:24px;padding:32px 16px;justify-content:center}
.card{padding:32px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.light{background:#fff}.dark{background:#0E0E10}.accent{background:#FF4D1A}
img{max-width:100%;height:auto}
</style></head><body>
<div class="row">
  <div class="card light"><img src="logo.svg" width="520" alt="VELOX"></div>
  <div class="card dark"><img src="logo-white.svg" width="520" alt="VELOX"></div>
  <div class="card light"><img src="logo-icon.svg" width="120" alt="VELOX icon"></div>
</div>
</body></html>
