<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>YUPOMA Brands</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#F7F4F1;color:#34302D}
h2{text-align:center;font-size:13px;letter-spacing:4px;color:#8a817b;margin:28px 0 0;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:20px;padding:16px;justify-content:center;align-items:center}
.card{padding:20px 28px;border-radius:18px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.05)}
img{display:block;max-width:100%;height:auto}
</style></head><body>
<h2>ИСХОДНЫЙ ЛОГОТИП</h2>
<div class="row"><div class="card"><img src="yupoma-original.svg" width="480" alt="YUPOMA"></div></div>
<h2>YUPOMA SPORT</h2>
<div class="row">
  <div class="card"><img src="yupoma-sport.svg" width="480" alt="YUPOMA SPORT"></div>
  <div class="card"><img src="yupoma-sport-mono.svg" width="480" alt="YUPOMA SPORT mono"></div>
</div>
<div class="row">
  <div class="card" style="padding:0;background:none;box-shadow:none"><img src="yupoma-sport-light.svg" width="480" alt="YUPOMA SPORT на оранжевом"></div>
  <div class="card"><img src="yupoma-sport-icon.svg" width="120" alt="иконка"></div>
  <div class="card"><img src="yupoma-sport-icon-orange.svg" width="120" alt="иконка"></div>
</div>
<h2>ДРУГИЕ НАПРАВЛЕНИЯ — ТОТ ЖЕ ПРИНЦИП</h2>
<div class="row"><div class="card"><img src="yupoma-bio.svg" width="480" alt="YUPOMA BIO"></div></div>
</body></html>
